<body>

  <script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
  <script>
    nn.get('body')
      .css('background', 'green')

    function drawGifs (e) {
      // if mouse is not (!) pressed down exit function
      if  (e.key === 's') {
        // otherwise, create a new gif
        skeleton = nn.create('img')
          .set('src', 'skeleton_hit.gif')
          .positionOrigin('center')
          .position(450, 480)
          .css('pointer-events', 'none')
          .addTo('body')
      }
      if (e.key === 'k') {
        // otherwise, create a new gif
        knight_1 = nn.create('img')
          .set('src', 'knight_hit.gif')
          .positionOrigin('center')
          .position(400, 480)
          .css('pointer-events', 'none')
          .addTo('body')
          .css('width', '400px')
      }
      if (e.key === '1') {
        // otherwise, create a new gif
        goblin_1 = nn.create('img')
          .set('src', 'goblin_hit.gif')
          .positionOrigin('center')
          .position(100, 480)
          .css('pointer-events', 'none')
          .addTo('body')
      }
      if (e.key === '2') {
        // otherwise, create a new gif
        knight_2 = nn.create('img')
          .set('src', 'knight_2_fighting.gif')
          .positionOrigin('center')
          .position(180, 425)
          .css('pointer-events', 'none')
          .addTo('body')
          .css('width', '400px')
      }
      if (e.key === '3') {
        // otherwise, create a new gif
        goblin_2 = nn.create('img')
          .set('src', 'goblin_2_hit.gif')
          .positionOrigin('center')
          .position(450, 250)
          .css('pointer-events', 'none')
          .addTo('body')
      }
      if (e.key === '4') {
        // otherwise, create a new gif
        knight_3 = nn.create('img')
          .set('src', 'knight_3_fighting.gif')
          .positionOrigin('center')
          .position(360, 230)
          .css('pointer-events', 'none')
          .addTo('body')
          .css('width', '350px')
      }
      if (e.key === '0') {
        // otherwise, create a new gif
        king = nn.create('img')
          .set('src', 'king.gif')
          .positionOrigin('center')
          .position(100, 300)
          .css('pointer-events', 'none')
          .addTo('body')
      }
    }

    nn.create('img')
      .set('src', 'castle.jpg')
      .positionOrigin('center')
      .css('pointer-events', 'none')
      .addTo('body')
      .css('width', nn.width)
      .css('height', nn.height)


    
    nn.on('keydown', drawGifs) 
    
const running = { a: false, b: false, c: false }

function zigzag (name, imgs, homes) {
  if (running[name]) return           
  if (imgs.includes(undefined)) return 
  running[name] = true

  let count = 0
  let dy = 20

  const timer = setInterval(function () {
    count = count + 1
    imgs.forEach(function (img, i) {
      img.position(homes[i][0] + count * 8, homes[i][1] + dy)
    })
    dy = dy * -1
    if (count === 15) {
      clearInterval(timer)
      imgs.forEach(function (img, i) {
        img.position(homes[i][0], homes[i][1])
      })
      running[name] = false
    }
  }, 80)
}

function moveGifs (e) {
  if (e.key === 'a') zigzag('a', [knight_1, skeleton], [[400, 480], [450, 480]])
  if (e.key === 'b') zigzag('b', [knight_2, goblin_1], [[180, 425], [100, 480]])
  if (e.key === 'c') zigzag('c', [knight_3, goblin_2], [[360, 230], [450, 250]])
}

nn.on('keydown', moveGifs)

swordsound = nn.create("audio")
              .set('controls', 'true')
              .set('src', 'sword.mp3')
              .addTo('body')
              .set('preload', 'auto')
              .set('style', 'display:none')
    
    
function playOnce() {
  swordsound.currentTime = 0 
  swordsound.play()
  }
  

function play(e){
  if (e.key === 'a'){
    playOnce()
    setTimeout(playOnce, 400)
    setTimeout(playOnce, 800)
  }
  if (e.key === 'b'){
    playOnce()
    setTimeout(playOnce, 400)
    setTimeout(playOnce, 800)
  }
  if (e.key === 'c'){
    playOnce()
    setTimeout(playOnce, 400)
    setTimeout(playOnce, 800)
  }
}
  
nn.on('keydown', play)    
      
  </script>
</body>
